<!doctype html><html lang="en"><head><meta charset="utf-8">

<script>window.OFC_BUILD='galaxy3d-20261029-1030';(function(){try{if(!/^https?:/.test(location.protocol))return;fetch(location.pathname+'?_='+Date.now(),{cache:'no-store'}).then(r=>r.text()).then(t=>{const m=t.match(/OFC_BUILD='([^']+)'/);if(m&&m[1]!==window.OFC_BUILD&&sessionStorage.getItem('gxB')!==m[1]){sessionStorage.setItem('gxB',m[1]);const q=new URLSearchParams(location.search);q.set('v',m[1]);location.replace(location.pathname+'?'+q+location.hash);}}).catch(()=>{});}catch(e){}})();</script>
<style>
html,body{margin:0;height:100%;background:#020308;overflow:hidden;font:11px/1.3 ui-monospace,Menlo,monospace;color:#8a94b0}
canvas{position:fixed;inset:0;width:100%;height:100%}
#hud{position:fixed;left:10px;top:8px;pointer-events:auto;opacity:.75}
#hud b{color:#ffd27a;letter-spacing:.12em}
#hud a,#hud span.c{color:#8a94b0;cursor:pointer;margin-right:6px;text-decoration:none}
#hud .on{color:#fff}
#st{position:fixed;left:10px;bottom:8px;opacity:.55}
#px{position:fixed;right:10px;top:44px;color:#fff;font-size:13px;opacity:.85;text-align:right}
</style></head><body>
<canvas id="cv"></canvas>
<div id="hud"><b>GALAXY TEST 3D</b> · The Compass · <span id="bid" style="color:#ffd27a"></span> · <a href="../">← live</a><br>
<span id="coins"></span> │ <span id="wins"></span></div>
<div id="px"></div><div id="st"></div>
<script>
// GALAXY TEST: each spark = one real trade print (5 public feeds). Trail = 1s VWAP of those prints, ends at NOW (right edge). Nothing drawn right of NOW.
const Q=new URLSearchParams(location.search);
const COINS={BTC:{kr:'BTC/USD',cb:'BTC-USD',bs:'btcusd',bn:'btcusd',bf:'tBTCUSD'},ETH:{kr:'ETH/USD',cb:'ETH-USD',bs:'ethusd',bn:'ethusd',bf:'tETHUSD'},
 SOL:{kr:'SOL/USD',cb:'SOL-USD',bs:'solusd',bn:'solusd',bf:'tSOLUSD'},XRP:{kr:'XRP/USD',cb:'XRP-USD',bs:'xrpusd',bn:'xrpusd',bf:'tXRPUSD'}};
const COIN=COINS[(Q.get('c')||'BTC').toUpperCase()]?(Q.get('c')||'BTC').toUpperCase():'BTC',CC=COINS[COIN];
const WINS=[60,300,900];let WIN=+Q.get('w')||300;if(!WINS.includes(WIN))WIN=300;
document.getElementById('coins').innerHTML=Object.keys(COINS).map(c=>`<a class="${c===COIN?'on':''}" href="?c=${c}&w=${WIN}">${c}</a>`).join('');
const wsp=document.getElementById('wins');const drawW=()=>wsp.innerHTML=WINS.map(w=>`<span class="c ${w===WIN?'on':''}" data-w="${w}">${w<120?w+'s':w/60+'m'}</span>`).join('');drawW();
wsp.onclick=e=>{const w=+e.target.dataset.w;if(w){WIN=w;drawW();history.replaceState(0,'','?c='+COIN+'&w='+w);}};
const T=[];const SEEN=new Set();const VEN={kraken:'·',coinbase:'·',bitstamp:'·',binanceus:'·',bitfinex:'·'};let nT=0;
function add(v,id,ts,px,qty,side){const k=v+id;if(SEEN.has(k))return;SEEN.add(k);if(!(px>0&&qty>0&&ts>0))return;ts=Math.min(ts,Date.now());T.push({ts,px,usd:px*qty,b:side==='buy',v,j:Math.random()});nT++;}
setInterval(()=>{T.sort((a,b)=>a.ts-b.ts);const cut=Date.now()-930000;let i=0;while(i<T.length&&T[i].ts<cut)i++;if(i)T.splice(0,i);if(SEEN.size>400000)SEEN.clear();},2000);
function feed(v,url,open,msg){let bo=1000;const go=()=>{let ws;try{ws=new WebSocket(url);}catch(e){return setTimeout(go,bo);}
 ws.onopen=()=>{VEN[v]='LIVE';bo=1000;open(o=>ws.send(JSON.stringify(o)));};
 ws.onmessage=e=>{let m;try{m=JSON.parse(e.data);}catch(x){return;}try{msg(m,ws);}catch(x){}};
 ws.onclose=()=>{VEN[v]='DOWN';setTimeout(go,bo);bo=Math.min(bo*2,30000);};ws.onerror=()=>{try{ws.close()}catch(x){}};};go();}
feed('kraken','wss://ws.kraken.com/v2',s=>s({method:'subscribe',params:{channel:'trade',symbol:[CC.kr],snapshot:true}}),m=>{if(m.channel==='trade')for(const d of m.data||[])add('kraken',d.trade_id,Date.parse(d.timestamp),+d.price,+d.qty,d.side);});
feed('coinbase','wss://ws-feed.exchange.coinbase.com',s=>s({type:'subscribe',product_ids:[CC.cb],channels:['matches']}),m=>{if(m.type==='match'||m.type==='last_match')add('coinbase',m.trade_id,Date.parse(m.time),+m.price,+m.size,m.side==='sell'?'buy':'sell');});
feed('bitstamp','wss://ws.bitstamp.net',s=>s({event:'bts:subscribe',data:{channel:'live_trades_'+CC.bs}}),(m,ws)=>{if(m.event==='bts:request_reconnect')ws.close();if(m.event==='trade'){const d=m.data;add('bitstamp',d.id,+d.microtimestamp/1000,+d.price,+d.amount,d.type===0?'buy':'sell');}});
feed('binanceus','wss://stream.binance.us:9443/stream?streams='+CC.bn+'@trade',()=>{},m=>{const d=m.data;if(d&&d.e==='trade')add('binanceus',d.t,d.T,+d.p,+d.q,d.m?'sell':'buy');});
feed('bitfinex','wss://api-pub.bitfinex.com/ws/2',s=>s({event:'subscribe',channel:'trades',symbol:CC.bf}),m=>{if(!Array.isArray(m))return;const d=m[1];const mk=t=>add('bitfinex',t[0],t[1],t[3],Math.abs(t[2]),t[2]>0?'buy':'sell');if(Array.isArray(d))d.forEach(mk);else if(d==='te')mk(m[2]);});
// recent-history seed (REST, public): Coinbase last 1000 + Binance.US last 1000 prints
fetch('https://api.exchange.coinbase.com/products/'+CC.cb+'/trades?limit=1000').then(r=>r.json()).then(a=>a.forEach(t=>add('coinbase',t.trade_id,Date.parse(t.time),+t.price,+t.size,t.side==='sell'?'buy':'sell'))).catch(()=>{});
fetch('https://api.binance.us/api/v3/trades?symbol='+CC.bn.toUpperCase()+'&limit=1000').then(r=>r.json()).then(a=>a.forEach(t=>add('binanceus',t.id,t.time,+t.price,+t.qty,t.isBuyerMaker?'sell':'buy'))).catch(()=>{});
// ---- render ----
const cv=document.getElementById('cv'),g=cv.getContext('2d');let W,H,DPR;
function rs(){DPR=Math.min(2,devicePixelRatio||1);W=cv.width=innerWidth*DPR;H=cv.height=innerHeight*DPR;}addEventListener('resize',rs);rs();
const SPR={};function sprite(col){if(SPR[col])return SPR[col];const c=document.createElement('canvas');c.width=c.height=64;const x=c.getContext('2d');const gr=x.createRadialGradient(32,32,0,32,32,32);
 gr.addColorStop(0,'rgba('+col+',1)');gr.addColorStop(.18,'rgba('+col+',.55)');gr.addColorStop(.5,'rgba('+col+',.12)');gr.addColorStop(1,'rgba('+col+',0)');x.fillStyle=gr;x.fillRect(0,0,64,64);return SPR[col]=c;}
let lo=0,hi=0;const fmt=p=>p>=1000?p.toLocaleString('en-US',{maximumFractionDigits:0}):p.toPrecision(5);
const CAP=()=>matchMedia('(pointer:coarse)').matches?6000:14000;let lodNote='';
// stable gaussian per print
function gs(t){if(t.gx===undefined){const u=Math.max(1e-6,t.j),v=Math.random();const r=Math.sqrt(-2*Math.log(u));t.gx=r*Math.cos(6.283*v);t.gy=r*Math.sin(6.283*v);t.gz=Math.random()-.5;}}
let drag=0,dragX=0,yawU=0,pitchU=0;cv.onpointerdown=e=>{drag=1;dragX=e.clientX;dragY=e.clientY;};addEventListener('pointerup',()=>drag=0);
let dragY=0;addEventListener('pointermove',e=>{if(!drag)return;yawU+=(e.clientX-dragX)*.004;pitchU=Math.max(-.6,Math.min(.6,pitchU+(e.clientY-dragY)*.003));dragX=e.clientX;dragY=e.clientY;});
function frame(){requestAnimationFrame(frame);const now=Date.now(),t0=now-WIN*1000;
 let a=0;while(a<T.length&&T[a].ts<t0)a++;let V=T.slice(a);
 g.globalCompositeOperation='source-over';g.globalAlpha=1;g.fillStyle='#020308';g.fillRect(0,0,W,H);
 if(V.length<2){g.fillStyle='#556';g.font=12*DPR+'px monospace';g.fillText('waiting for prints…',W/2-60*DPR,H/2);upd(V,now);return;}
 let mn=Infinity,mx=-Infinity,su=0;for(const t of V){if(t.px<mn)mn=t.px;if(t.px>mx)mx=t.px;su+=t.usd;}const pad=(mx-mn)*0.12||mn*0.0005;
 if(!lo){lo=mn-pad;hi=mx+pad;}lo+=(mn-pad-lo)*0.08;hi+=(mx+pad-hi)*0.08;const mu=su/V.length;
 // LOD: keep every print >= mu; sample smaller ones evenly if over cap
 const cap=CAP();let D=V;lodNote='';
 if(V.length>cap){const big=V.filter(t=>t.usd>=mu),sm=V.length-big.length,keep=Math.max(0,cap-big.length)/sm;D=V.filter(t=>t.usd>=mu||t.j<keep);lodNote=' · LOD: all big prints + '+Math.round(keep*100)+'% of small';}
 // world: z = age (0 at NOW .. ZD far past), y = price, x = lateral scatter (buys left, sells right, spread grows with size)
 const ZD=9,Yw=p=>((p-lo)/(hi-lo)-.5)*1.8;
 const MOB=matchMedia('(pointer:coarse)').matches||innerWidth<700;const yaw=(MOB?.28:.55)+(MOB?.22:.3)*Math.sin(now/7000)+yawU,pitch=(MOB?-.3:.28)+.12*Math.sin(now/9000)+pitchU,cy=Math.cos(yaw),sy=Math.sin(yaw),cp=Math.cos(pitch),sp=Math.sin(pitch);
 const F=Math.min(W,H)*(MOB?1.05:1.2),CX=W*.5,CYc=H*.5,camD=MOB?5:5,zc=ZD*(MOB?.22:.45);
 const PJ=(x,y,z)=>{z-=zc;const x1=x*cy-z*sy,z1=x*sy+z*cy;const y1=y*cp-z1*sp,z2=y*sp+z1*cp+camD;if(z2<.15)return null;const k=F/z2;return[CX+x1*k,CYc-y1*k,k,z2];};
 // faint depth grid: price rings every quarter at a few time slices (time tunnel)
 g.strokeStyle='rgba(120,140,200,.07)';g.lineWidth=DPR;
 for(let i=0;i<=4;i++){const zz=ZD*i/4;g.beginPath();let f=1;for(const [x,y] of [[-1.4,-1.2],[1.4,-1.2],[1.4,1.2],[-1.4,1.2],[-1.4,-1.2]]){const p=PJ(x,y,zz);if(!p)continue;f?g.moveTo(p[0],p[1]):g.lineTo(p[0],p[1]);f=0;}g.stroke();}
 for(const [x,y] of [[-1.4,-1.2],[1.4,-1.2],[1.4,1.2],[-1.4,1.2]]){const p=PJ(x,y,0),q=PJ(x,y,ZD);if(p&&q){g.beginPath();g.moveTo(p[0],p[1]);g.lineTo(q[0],q[1]);g.stroke();}}
 g.globalCompositeOperation='lighter';const sb=sprite('110,160,255'),ss=sprite('255,110,150'),sw=sprite('255,240,210');
 for(const t of D){gs(t);const age=(now-t.ts)/(WIN*1000),s=Math.sqrt(t.usd/mu);
  const lat=(t.b?-1:1)*(.06+Math.abs(t.gx)*.28*(1+s*.6)),x=lat,y=Yw(t.px)+t.gy*.05*(1+s*.4),z=age*ZD+t.gz*.04;
  const p=PJ(x,y,z);if(!p)continue;const r=Math.min(60*DPR,(.006+.011*s)*p[2]);g.globalAlpha=Math.min(1,Math.max(.08,.85-age*.6)*(1.6/p[3]+.3));
  g.drawImage(t.usd>mu*12?sw:(t.b?sb:ss),p[0]-r,p[1]-r,2*r,2*r);}
 // trail: 1s VWAP tube through depth, ends at NOW (z=0)
 const BK=new Map();for(const t of V){const k=Math.floor(t.ts/1000);const b=BK.get(k)||{pu:0,u:0,ts:0};b.pu+=t.px*t.usd;b.u+=t.usd;b.ts=Math.max(b.ts,t.ts);BK.set(k,b);}
 const last=V[V.length-1];const W3=[...BK.keys()].sort((x,y)=>x-y).map(k=>{const b=BK.get(k);return[(now-b.ts)/(WIN*1000)*ZD,Yw(b.pu/b.u),b.u];});
 W3.push([(now-last.ts)/(WIN*1000)*ZD,Yw(last.px),0],[0,Yw(last.px),0]);   // hold last printed price to NOW, never beyond
 const P=W3.map(([z,y,u])=>[PJ(0,y,z),u]).filter(p=>p[0]);g.lineCap='round';
 for(const [w,al,col] of [[.05,.07,'255,180,80'],[.025,.16,'255,200,110'],[.011,.55,'255,225,160'],[.004,1,'255,255,240']]){g.strokeStyle='rgb('+col+')';
  for(let i=1;i<P.length;i++){const [p,u]=P[i],[q]=P[i-1];const k=(p[2]+q[2])/2,fade=1-Math.min(1,p[3]/(camD+ZD*.8));g.globalAlpha=al*Math.max(.15,fade);
   g.lineWidth=Math.max(DPR,w*k*(1+Math.min(2,Math.sqrt((u||0)/mu/20))));g.beginPath();g.moveTo(q[0],q[1]);g.lineTo(p[0],p[1]);g.stroke();}}
 const h=P[P.length-1][0],pulse=1+.15*Math.sin(now/180),hs=sprite('255,240,200');g.globalAlpha=1;
 for(const r of [.16,.06,.022]){const R=r*h[2]*pulse;g.drawImage(hs,h[0]-R,h[1]-R,2*R,2*R);}
 // NOW plane outline
 g.globalCompositeOperation='source-over';g.globalAlpha=1;g.strokeStyle='rgba(255,230,180,.18)';g.beginPath();let f=1;
 for(const [x,y] of [[-1.4,-1.2],[1.4,-1.2],[1.4,1.2],[-1.4,1.2],[-1.4,-1.2]]){const p=PJ(x,y,0);if(!p)continue;f?g.moveTo(p[0],p[1]):g.lineTo(p[0],p[1]);f=0;}g.stroke();
 g.fillStyle='rgba(255,230,180,.45)';g.font=10*DPR+'px monospace';{const p=PJ(1.4,-1.2,0);if(p)g.fillText('NOW',p[0]+4*DPR,p[1]);const q=PJ(1.4,-1.2,ZD);if(q)g.fillText('−'+(WIN<120?WIN+'s':WIN/60+'m'),q[0]+4*DPR,q[1]);
  const hi3=PJ(-1.4,1.1,0),lo3=PJ(-1.4,-1.1,0);if(hi3)g.fillText(fmt(hi),hi3[0]-60*DPR,hi3[1]);if(lo3)g.fillText(fmt(lo),lo3[0]-60*DPR,lo3[1]);}
 upd(V,now,last,D.length);}
let lu=0;function upd(V,now,last,nd){if(now-lu<500)return;lu=now;
 document.getElementById('px').innerHTML=last?COIN+' $'+fmt(last.px)+'<br><span style="font-size:10px;opacity:.6">'+V.length.toLocaleString()+' prints in view'+(nd&&nd<V.length?' ('+nd.toLocaleString()+' drawn)':'')+'</span>':'';
 document.getElementById('st').textContent='build '+OFC_BUILD+' · '+Object.entries(VEN).map(([k,v])=>k+' '+v).join(' · ')+' · sparks = real prints · trail = 1s VWAP · depth = time · drag to orbit · nothing past NOW'+lodNote;}
document.getElementById('bid').textContent=OFC_BUILD;frame();
</script></body></html>
